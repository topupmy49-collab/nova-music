name: Build NOVA MUSIC APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack project
        run: unzip -q -o nova-music-project.zip -d project
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests
        continue-on-error: true
        run: gradle -p project :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle -p project :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-MUSIC-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
